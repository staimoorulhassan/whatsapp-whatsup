[project]
name = "whatsup-now"
version = "1.0.0"
description = "WhatsApp IP Hunter - CLI tool for analyzing WhatsApp P2P call vulnerabilities and extracting IP addresses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "scapy>=2.5.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "geoip2>=4.8.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
whatsup-now = "src.cli:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
